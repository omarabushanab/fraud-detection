version: '3.8'

services:
  # The ML Classification Component
  classifier-api:
    build: ./xlmr_service
    image: phishing-classifier:v1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # The main logic that connects to Gmail and handles preprocessing
  orchestrator:
    build: ./orchestrator
    depends_on:
      classifier-api:
        condition: service_healthy # Only starts orchestrator once the model is loaded
    environment:
      - CLASSIFIER_URL=http://classifier-api:8000/predict
    volumes:
      - ./orchestrator/token.pickle:/app/token.pickle