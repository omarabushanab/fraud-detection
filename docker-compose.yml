version: '3.8'

services:
  xlmr_service:
    build: ./xlmr_service
    ports:
      - "8001:8001"
    environment:
      - MODEL_DIR=/app/model/xlm-r-phishing-final

  gmail_service:
    build: ./gmail_service
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - DETECTOR_URL=${DETECTOR_URL}
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - BASE_URL=${BASE_URL}
    ports:
      - "8002:8002"
    depends_on:
      xlmr_service:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # We add --appendonly yes for better persistence and --dir /data to match the volume
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data", "--protected-mode", "no", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
  
  classifier_service:
    build: ./classifier_service
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy


volumes:
  redis_data: