services:
  xlmr_service:
    build: ./xlmr_service
    env_file:
      - .env
    ports:
      - "8001:8001"
    environment:
      - MODEL_DIR=/app/model/xlm-r-phishing-final-4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
 
  classifier_service:
    build: ./classifier_service
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./datasets:/app/datasets
      - ./classifier_service/models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  clamav:
    image: clamav/clamav:latest
    restart: always
    healthcheck:
      test: ["CMD", "sh", "-c", "echo PING | nc localhost 3310 | grep PONG"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s  # ClamAV needs ~3-5 minutes to load virus definitions
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  attachment_service:
    build: ./attachment_service
    ports:
      - "8004:8004"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    environment:
      - CLAMAV_HOST=clamav
      - CLAMD_PORT=3310
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 120s  # Give ClamAV time to fully start

  gmail_service:
    build: ./gmail_service
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - DETECTOR_URL=${DETECTOR_URL}
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - BASE_URL=${BASE_URL}
    ports:
      - "8002:8002"
    depends_on:
      xlmr_service:
        condition: service_healthy
      redis:
        condition: service_healthy
      attachment_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data", "--protected-mode", "no", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  redis_data:
  datasets: