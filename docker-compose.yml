version: '3.8'

services:

  # Your existing ML service
  xlmr_service:
    build: ./xlmr_service
    ports:
      - "8001:8001"
    environment:
      - MODEL_DIR=/app/model/xlm-r-phishing-final

  # Your Gmail background processor
  gmail_service:
    build: ./gmail_service
    environment:
      - REDIS_URL=redis://redis:6379  # Central database for user state
      - DETECTOR_URL=http://xlmr_service:8001/predict
    ports:
      - "8002:8002"
    depends_on:
      - xlmr_service
      - redis  # Redis for storing multi-user tokens and history IDs
  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data  # This maps a Docker volume to the Redis data directory
    command: redis-server --save 60 1 --loglevel warning # Save every 60 seconds if 1 key changed
    restart: always

volumes:
  redis_data: # Define the volume at the bottom of the file