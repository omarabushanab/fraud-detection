version: '3.8'

services:
  # The UI Dashboard
  ui_service:
    build: ./ui_service  # Folder containing the UI main.py and Dockerfile
    ports:
      - "8000:8000"     # UI will be at http://localhost:8000
    environment:
      - DETECTOR_URL=http://xlmr_service:8001/predict
    depends_on:
      - xlmr_service

  # Your existing ML service
  xlmr_service:
    build: ./xlmr_service
    ports:
      - "8001:8001"
    environment:
      - MODEL_DIR=/app/model/xlm-r-phishing-final

  # Your Gmail background processor
  gmail_service:
    build: ./gmail_service
    ports:
      - "8002:8002"
    depends_on:
      - xlmr_service
      - redis  # Redis for storing multi-user tokens and history IDs
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"